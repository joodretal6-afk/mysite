<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فاتورة — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --line:#e6e9ec; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:#eceff1; color:#263238; padding:20px; }
    .toolbar { max-width:600px; margin:0 auto 14px; display:flex; gap:10px; justify-content:center; }
    .btn { padding:11px 22px; border:none; border-radius:9px; font-weight:bold; cursor:pointer; font-family:inherit; font-size:15px; }
    .btn.print { background:var(--green); color:#fff; }
    .btn.back { background:#607d8b; color:#fff; text-decoration:none; display:inline-flex; align-items:center; }
    .invoice { max-width:600px; margin:0 auto; background:#fff; border-radius:14px; padding:36px; box-shadow:0 6px 24px rgba(0,0,0,.08); }
    .head { text-align:center; border-bottom:3px solid var(--green); padding-bottom:18px; margin-bottom:22px; }
    .head .logo { font-size:44px; }
    .head h1 { color:var(--green2); font-size:24px; margin-top:6px; }
    .head .sub { color:#78909c; font-size:14px; margin-top:4px; }
    .meta { display:flex; justify-content:space-between; font-size:14px; color:#546e7a; margin-bottom:20px; flex-wrap:wrap; gap:8px; }
    .rows { width:100%; border-collapse:collapse; margin-bottom:20px; }
    .rows th { background:#f0f4f1; color:var(--green2); padding:12px; text-align:right; font-size:14px; }
    .rows td { padding:12px; border-bottom:1px solid var(--line); font-size:15px; }
    .info { background:#f9fbf9; border-radius:10px; padding:16px; margin-bottom:20px; }
    .info div { margin:7px 0; font-size:15px; }
    .info b { color:var(--green2); }
    .total { text-align:left; font-size:22px; font-weight:800; color:var(--green2); border-top:2px dashed var(--line); padding-top:16px; }
    .foot { text-align:center; color:#78909c; font-size:14px; margin-top:24px; }
    @media print { body{background:#fff;padding:0;} .toolbar{display:none;} .invoice{box-shadow:none;max-width:100%;} }
  </style>
    <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("pm-theme")||"aurora")}catch(e){}</script>
  <link rel="stylesheet" href="/premium.css">
</head>
<body>
  <div class="toolbar">
    <button class="btn print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <a class="btn back" href="/admin">→ رجوع</a>
  </div>
  <div class="invoice" id="inv"><div style="text-align:center;padding:40px;color:#78909c">جاري التحميل...</div></div>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    const id = location.pathname.split('/').pop();
    async function load(){
      const r = await fetch('/admin/api/order/'+id);
      if(r.status===401){ location.href='/admin/login'; return; }
      if(!r.ok){ document.getElementById('inv').innerHTML='<div style="text-align:center;padding:40px;color:#c62828">الفاتورة غير موجودة</div>'; return; }
      const o = await r.json();
      const items = (o.order_string||'').split('+').map(s=>s.trim()).filter(Boolean);
      // 🔴 شارة ثقة العنوان: الفاتورة ما بتطبع عنوان مشكوك فيه بصمت.
      // الطلبات القديمة (قبل محرّك العناوين) درجتها -1 — منقول عنها "غير مقاس"
      // بدل ما ندّعي إنها مؤكّدة.
      function addrBadge(o){
        const s = Number(o.address_score);
        const lvl = o.address_level || '';
        if (!Number.isFinite(s) || s < 0)
          return ' <span style="background:#eceff1;color:#607d8b;padding:2px 8px;border-radius:10px;font-size:11px">غير مقاس</span>';
        const c = s >= 80 ? ['#e8f5e9','#2e7d32'] : s >= 68 ? ['#fff8e1','#ef6c00'] : ['#ffebee','#c62828'];
        const warn = s < 68 ? ' — راجعه قبل التوصيل' : '';
        return ` <span style="background:${c[0]};color:${c[1]};padding:2px 8px;border-radius:10px;font-size:11px">${esc(lvl)||s} (${s}%)${warn}</span>`;
      }
      const rows = items.map(it=>`<tr><td>${esc(it)}</td></tr>`).join('') || '<tr><td>—</td></tr>';
      document.getElementById('inv').innerHTML = `
        <div class="head"><div class="logo">🧀</div><h1>${esc(o.page_name)}</h1><div class="sub">فاتورة رقم #${o.id}</div></div>
        <div class="meta"><span>التاريخ: ${new Date(o.created_at).toLocaleString('ar-EG')}</span><span>الحالة: ${esc(o.status)}</span></div>
        <table class="rows"><thead><tr><th>تفاصيل الطلب</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="info">
          <div>📍 <b>العنوان:</b> ${esc(o.area)||'—'}${addrBadge(o)}</div>
          <div>📞 <b>التلفون:</b> ${esc(o.phone)||'—'}</div>
        </div>
        <div class="total">الإجمالي: ${(+o.total).toFixed(2)} دينار</div>
        <div class="foot">صحتين وعافية 🌹 — شكراً لطلبكم</div>`;
      document.title = 'فاتورة #'+o.id+' - '+o.page_name;
    }
    load();
  </script>
  <script src="/theme.js" defer></script>
</body>
</html>
