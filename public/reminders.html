<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تذكير إعادة الطلب — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --mut:#78909c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:#263238; }
    header { background:var(--green); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    header h1 { font-size:19px; }
    header a { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:8px 14px; border-radius:8px; font-size:13px; }
    .wrap { max-width:1100px; margin:0 auto; padding:22px; }
    .note { background:#fff8e1; border-radius:10px; padding:12px 16px; font-size:13px; color:#8d6e00; margin-bottom:16px; line-height:1.7; }
    .bar { background:var(--card); border-radius:12px; padding:14px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.05); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .bar select { padding:9px 12px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit; }
    .card { background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { padding:11px 13px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { background:#f0f4f1; color:var(--green2); font-weight:700; }
    .btn { padding:8px 14px; background:var(--green); color:#fff; border:none; border-radius:8px; cursor:pointer; font-family:inherit; font-size:13px; }
    .btn:hover { background:var(--green2); }
    .btn:disabled { opacity:.5; }
    .sent { color:var(--green); font-size:13px; font-weight:600; }
    .empty { text-align:center; padding:40px; color:var(--mut); }
  </style>
</head>
<body>
  <header>
    <h1>⏰ تذكير إعادة الطلب</h1>
    <a href="/admin">→ اللوحة الرئيسية</a>
  </header>
  <div class="wrap">
    <div class="note">
      💡 هدول زبائن آخر طلب لهم صار له فترة — وقت تذكّرهم يطلبوا من جديد!
      <br>⚠️ فيسبوك بيسمح بإرسال الرسائل <b>خلال 24 ساعة</b> من آخر تواصل مع الزبون. لو مرّت المدة، الإرسال ممكن ما يوصل (بيخبرك النظام).
    </div>
    <div class="bar">
      <label>آخر طلب أقدم من:</label>
      <select id="days" onchange="load()">
        <option value="7">7 أيام</option>
        <option value="14" selected>14 يوم</option>
        <option value="21">21 يوم</option>
        <option value="30">30 يوم</option>
      </select>
      <span id="count" style="color:var(--mut)"></span>
    </div>
    <div class="card">
      <table><thead><tr><th>الزبون</th><th>عدد طلباته</th><th>آخر طلب</th><th>الصفحة</th><th>تذكير</th></tr></thead>
        <tbody id="rows"></tbody></table>
      <div class="empty" id="empty" style="display:none">ما في زبائن بحاجة تذكير حالياً</div>
    </div>
  </div>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function daysAgo(t){ return Math.floor((Date.now()-t)/86400000); }
    async function load(){
      const days=document.getElementById('days').value;
      const r=await fetch('/admin/api/due-reorder?days='+days);
      if(r.status===401){ location.href='/admin/login'; return; }
      const {customers}=await r.json();
      document.getElementById('count').textContent=`(${customers.length} زبون)`;
      const tb=document.getElementById('rows'), empty=document.getElementById('empty');
      tb.innerHTML='';
      if(!customers.length){ empty.style.display='block'; return; }
      empty.style.display='none';
      customers.forEach((c,i)=>{
        tb.insertAdjacentHTML('beforeend',`<tr>
          <td>📞 ${esc(c.phone)}</td>
          <td>${c.orders_count}</td>
          <td>قبل ${daysAgo(c.last_at)} يوم</td>
          <td>${esc(c.page_name)}</td>
          <td id="act${i}"><button class="btn" onclick='sendR(${JSON.stringify(c).replace(/'/g,"&#39;")},${i})'>📨 ذكّره</button></td>
        </tr>`);
      });
    }
    async function sendR(c,i){
      const cell=document.getElementById('act'+i);
      cell.innerHTML='...';
      try{
        const r=await fetch('/admin/api/send-reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page_id:c.page_id,sender_id:c.sender_id,phone:c.phone})});
        const d=await r.json();
        cell.innerHTML = r.ok ? '<span class="sent">✅ تم الإرسال</span>' : '<span style="color:#c62828;font-size:12px">'+esc(d.error||'فشل')+'</span>';
      }catch{ cell.innerHTML='<span style="color:#c62828">فشل</span>'; }
    }
    load();
  </script>
</body>
</html>
