<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حملة تسويقية — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --mut:#78909c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:#263238; }
    header { background:var(--green); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    header h1 { font-size:19px; }
    header a { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:8px 14px; border-radius:8px; font-size:13px; }
    .wrap { max-width:760px; margin:0 auto; padding:22px; }
    .note { background:#fff8e1; border-radius:10px; padding:12px 16px; font-size:13px; color:#8d6e00; margin-bottom:16px; line-height:1.7; }
    .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); margin-bottom:16px; }
    label { display:block; font-size:13px; font-weight:700; color:var(--green2); margin-bottom:6px; }
    textarea, select { width:100%; padding:12px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; }
    textarea { min-height:120px; resize:vertical; }
    .row { margin-bottom:16px; }
    .btn { padding:12px 26px; background:var(--green); color:#fff; border:none; border-radius:10px; cursor:pointer; font-family:inherit; font-size:15px; font-weight:700; }
    .btn:hover { background:var(--green2); }
    .btn:disabled { opacity:.5; }
    .stat { font-size:14px; color:var(--mut); margin-top:10px; }
    .result { margin-top:14px; padding:12px; border-radius:10px; font-size:14px; display:none; }
    .result.ok { background:#e8f5e9; color:var(--green2); }
    .result.err { background:#ffebee; color:#c62828; }
  </style>
</head>
<body>
  <header>
    <h1>📢 حملة تسويقية</h1>
    <a href="/admin">→ اللوحة الرئيسية</a>
  </header>
  <div class="wrap">
    <div class="note">
      💡 ابعت رسالة لكل زبائنك دفعة وحدة — عروض، منتجات جديدة، تخفيضات.
      <br>⚠️ فيسبوك بيسمح بإرسال الرسائل <b>خلال 24 ساعة</b> من آخر تواصل مع الزبون. الزبائن اللي مرّت مدتهم ممكن ما توصلهم الرسالة.
    </div>
    <div class="card">
      <div class="row">
        <label>الصفحة</label>
        <select id="page"><option value="">كل الصفحات</option></select>
      </div>
      <div class="row">
        <label>نص الرسالة</label>
        <textarea id="text" placeholder="مثال: عرض خاص هالأسبوع! جبنة غنم بلدي طازة 🧀 — اطلب الآن قبل ما يخلص!"></textarea>
      </div>
      <button class="btn" id="send" onclick="send()">📨 إرسال الحملة</button>
      <div class="stat" id="stat"></div>
      <div class="result" id="result"></div>
    </div>
  </div>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    let TARGETS=[];
    async function load(){
      const r=await fetch('/admin/api/broadcast/targets');
      if(r.status===401){ location.href='/admin/login'; return; }
      const {targets}=await r.json();
      TARGETS=targets||[];
      const pages={};
      TARGETS.forEach(t=>{ if(t.page_id) pages[t.page_id]=t.page_name||t.page_id; });
      const sel=document.getElementById('page');
      Object.entries(pages).forEach(([id,name])=>{
        sel.insertAdjacentHTML('beforeend',`<option value="${esc(id)}">${esc(name)}</option>`);
      });
      updateStat();
      sel.onchange=updateStat;
    }
    function updateStat(){
      const pid=document.getElementById('page').value;
      const n=pid? TARGETS.filter(t=>String(t.page_id)===pid).length : TARGETS.length;
      document.getElementById('stat').textContent=`سيتم الإرسال لـ ${n} زبون`;
    }
    async function send(){
      const text=document.getElementById('text').value.trim();
      const page_id=document.getElementById('page').value||undefined;
      const res=document.getElementById('result');
      res.style.display='none';
      if(!text){ res.className='result err'; res.style.display='block'; res.textContent='اكتب نص الرسالة أولاً'; return; }
      if(!confirm('متأكد إنك بدك تبعت الحملة لكل الزبائن؟')) return;
      const btn=document.getElementById('send');
      btn.disabled=true; btn.textContent='⏳ جاري الإرسال...';
      try{
        const r=await fetch('/admin/api/broadcast/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,page_id})});
        const d=await r.json();
        if(r.ok){ res.className='result ok'; res.textContent=`✅ تم الإرسال لـ ${d.sent} زبون (فشل ${d.failed}) من أصل ${d.total}`; }
        else { res.className='result err'; res.textContent=d.error||'فشل الإرسال'; }
        res.style.display='block';
      }catch{ res.className='result err'; res.style.display='block'; res.textContent='خطأ في الاتصال'; }
      btn.disabled=false; btn.textContent='📨 إرسال الحملة';
    }
    load();
  </script>
</body>
</html>
