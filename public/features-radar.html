<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>📡 رادار السوق اليومي</title><link rel="stylesheet" href="/brain-ui.css">
<style>
  .truthbox { background:rgba(255,92,92,.08); border-right:4px solid var(--red); border-radius:10px;
              padding:15px 18px; margin-bottom:16px; font-size:13.5px; line-height:1.95; }
  .okbox { background:rgba(61,220,132,.08); border-right:4px solid var(--green); border-radius:10px;
           padding:14px 18px; margin-bottom:16px; font-size:13.5px; line-height:1.9; }
  .warnbox { background:rgba(255,176,32,.08); border-right:4px solid var(--amber); border-radius:10px;
             padding:14px 18px; margin-bottom:16px; font-size:13.5px; line-height:1.9; }
  pre.digest { white-space:pre-wrap; font-family:inherit; font-size:13.5px; line-height:1.95;
               background:var(--card2); padding:16px; border-radius:10px; }
  .spark { display:flex; align-items:flex-end; gap:2px; height:34px; }
  .spark i { flex:1; background:var(--acc); border-radius:2px 2px 0 0; min-height:2px; opacity:.75; }
  .spark i:last-child { opacity:1; background:var(--green); }
  .obs { display:grid; grid-template-columns:repeat(3,1fr) auto; gap:6px; align-items:end; }
  .obs input { width:100%; }
  a.lib { color:var(--blue); text-decoration:none; font-size:12px; }
</style>
    <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("pm-theme")||"aurora")}catch(e){}</script>
  <link rel="stylesheet" href="/premium.css">
</head>
<body>
<header><h1>📡 رادار السوق اليومي</h1><div class="r">
  <button class="btn" id="scan">🔄 شغّل الفحص</button>
  <a href="/admin/features">→ مركز الميزات</a></div></header>
<div class="wrap"><div id="tabs"></div><div id="out"></div></div>
<script src="/brain-ui.js"></script>
<script>
const B = window.BUI, A = "/admin/f-api/radar";
let UI;
const g = id => document.querySelector("#" + id);
const api = async (m, p, body) => {
  const r = await fetch(A + p, { method: m,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
};

const spark = h => {
  if (!h || h.length < 2) return '<span class="mut">بدها وقت</span>';
  const max = Math.max(...h.map(x => x.score), 1);
  return `<div class="spark">${h.slice(-20).map(x =>
    `<i style="height:${Math.max(4, x.score * 100 / max)}%" title="${x.day}: ${x.score}"></i>`).join("")}</div>`;
};
const dtag = d => d == null ? '<span class="mut">—</span>'
  : d > 0 ? `<span class="tag green">+${d}</span>`
  : d < 0 ? `<span class="tag red">${d}</span>` : '<span class="tag">ثابت</span>';

// مؤشر مدة الإعلان — قلب الرادار
const daysTag = d => {
  const n = Number(d);
  if (!(n >= 0)) return '<span class="tag amber">بلا رصد</span>';
  if (n >= 60) return `<span class="tag green">${n} يوم · رابح قوي</span>`;
  if (n >= 30) return `<span class="tag green">${n} يوم · مثبت</span>`;
  if (n >= 14) return `<span class="tag amber">${n} يوم · مؤشر</span>`;
  return `<span class="tag">${n} يوم · قصير</span>`;
};

UI = B.mount([
// ═══ اللوحة ═══
{
  label: "📊 اللوحة", url: () => `${A}/board?days=60`,
  render: j => {
    const H = [];
    if (j.maturity.startsWith("🔴"))
      H.push(`<div class="truthbox"><b>${B.esc(j.maturity)}</b><br>
        الرادار بيبني قيمته بالتراكم. شغّله كل يوم وبعد أسبوعين بتبدأ تشوف
        شو بيصعد وشو بينطفي فعلياً — وهاي بيانات ما بيملكها منافسك.</div>`);
    else H.push(`<div class="okbox"><b>${B.esc(j.maturity)}</b></div>`);

    H.push(B.kpis([
      { lbl: "أصناف مراقبة", val: j.total },
      { lbl: "مفحوصة", val: j.scanned, tone: "green" },
      { lbl: "إعلاناتها 30+ يوم", val: j.proven.length, tone: "green" },
      { lbl: "درجتها ناقصة", val: j.incomplete.length, tone: "amber" }
    ]));

    if (j.rising.length) H.push(`<div class="okbox"><b>📈 صاعد هالأسبوع:</b> ` +
      j.rising.slice(0, 6).map(r => `${B.esc(r.term)} <b>+${r.weekDelta}</b>`).join(" · ") + `</div>`);
    if (j.falling.length) H.push(`<div class="warnbox"><b>📉 هابط:</b> ` +
      j.falling.slice(0, 6).map(r => `${B.esc(r.term)} <b>${r.weekDelta}</b>`).join(" · ") + `</div>`);

    H.push(`<div class="box"><h3>الترتيب — الأعلى درجة أول</h3>` +
      B.table(["الصنف", "الدرجة", "يوم", "أسبوع", "مدة أطول إعلان", "معلنون", "نسخ", "حضور", "السعر", "الاتجاه", ""],
        j.rows, r => [
        `<b>${B.esc(r.term)}</b>${r.complete === false ? '<div class="mut">⚠️ درجة ناقصة</div>' : ""}`,
        r.score == null ? '<span class="mut">—</span>'
          : `<b style="font-size:15px;color:${r.score >= 70 ? "var(--green)" : r.score >= 45 ? "var(--amber)" : "var(--mut)"}">${r.score}</b>`,
        dtag(r.delta), dtag(r.weekDelta),
        daysTag(r.max_days),
        Number(r.advertisers) >= 0 ? B.num(r.advertisers) : '<span class="mut">—</span>',
        Number(r.variations) >= 0 ? B.num(r.variations) : '<span class="mut">—</span>',
        r.hasData ? B.num(r.web_results) : "—",
        r.price_low ? `${B.num(r.price_low)}–${B.num(r.price_high)}` : '<span class="mut">—</span>',
        spark(r.history),
        r.adLibrary ? `<a class="lib" href="${B.esc(r.adLibrary.url)}" target="_blank" rel="noopener">🔗 المكتبة</a>` : ""
      ]) + `</div>`);

    if (j.digest) H.push(`<div class="box"><h3>📋 ملخّص اليوم</h3>
      <pre class="digest">${B.esc(j.digest)}</pre>
      ${j.lastRun ? `<div class="mut">آخر فحص: ${B.esc(j.lastRun.day)} —
        ${j.lastRun.scanned} صنف بـ${Math.round((j.lastRun.ms || 0) / 1000)}ث</div>` : ""}</div>`);
    return H.join("");
  }
},

// ═══ الرصد — اللي بيكمّل الدرجة ═══
{
  label: "👁️ الرصد", url: () => `${A}/board?days=30`,
  render: j => {
    if (!j.rows.length) return `<div class="warnbox">ضيف أصناف لقائمة المراقبة أول.</div>`;
    return `<div class="truthbox">
      <b>🔴 ليش الرصد يدوي — والحقيقة كاملة:</b><br>
      فيسبوك <b>ما بينشر مبيعات</b>. ولا أداة بالدنيا عندها رقم مبيعات منتج على فيسبوك.<br><br>
      بس في إشارة عامة قوية: <b>ولا معلن بيدفع 30 يوم على إعلان خسران.</b><br>
      فمدة بقاء الإعلان أقرب مؤشر مجاني للربحية:<br>
      • <b>14+ يوم</b> → مؤشر مبدئي &nbsp; • <b>30+ يوم</b> → مثبت غالباً &nbsp; • <b>60+ يوم</b> → رابح قوي<br><br>
      ومكتبة الإعلانات بتتطلب متصفح (الـAPI بيغطي أوروبا وبريطانيا بس) —
      والاستخراج الآلي من فيسبوك بيوقّف صفحتك. فالرصد بعينك، وهو أدق.
    </div>
    <div class="box"><h3>افتح المكتبة وسجّل اللي بتشوفه</h3>
      ${j.rows.map(r => `<div class="item">
        <div class="t">${B.esc(r.term)}
          ${r.adLibrary ? `<a class="lib" href="${B.esc(r.adLibrary.url)}" target="_blank" rel="noopener">
            🔗 افتح مكتبة الإعلانات</a>` : ""}
          ${daysTag(r.max_days)}</div>
        <div class="obs" style="margin-top:8px">
          <div class="fld"><label>كم معلن ظاهر؟</label>
            <input type="number" min="0" id="a${r.id}" value="${Number(r.advertisers) >= 0 ? r.advertisers : ""}"></div>
          <div class="fld"><label>أطول إعلان (يوم)</label>
            <input type="number" min="0" id="d${r.id}" value="${Number(r.max_days) >= 0 ? r.max_days : ""}"></div>
          <div class="fld"><label>كم نسخة إعلانية؟</label>
            <input type="number" min="0" id="v${r.id}" value="${Number(r.variations) >= 0 ? r.variations : ""}"></div>
          <button class="btn" onclick="obs(${r.id})">احفظ</button>
        </div>
        <div class="mut" style="margin-top:6px">${B.esc(r.scoreNote || "")}</div>
      </div>`).join("")}
      <div class="warnbox" style="margin-top:14px">
        <b>كيف تقرأ "أطول إعلان":</b> بالمكتبة كل إعلان مكتوب تحته
        <b>"Active since"</b> أو تاريخ البدء. خذ أقدم إعلان <b>لسه نشط</b> واحسب كم يوم صار له.
        هاد الرقم لحاله 40% من الدرجة.
      </div>
    </div>`;
  },
  after: () => {
    window.obs = async id => {
      const val = x => { const e = g(x + id); return e && e.value !== "" ? Number(e.value) : ""; };
      try {
        const j = await api("POST", `/observe/${id}`,
          { advertisers: val("a"), max_days: val("d"), variations: val("v") });
        alert(`انحفظ. الدرجة الجديدة: ${j.score}\n\n${j.note}`);
        UI.reload();
      } catch (e) { alert(e.message); }
    };
  }
},

// ═══ قائمة المراقبة ═══
{
  label: "📝 قائمة المراقبة", url: () => `${A}/watch`,
  render: j => `<div class="box"><h3>ضيف أصناف</h3>
    <div class="form">
      <div class="fld" style="flex:1;min-width:260px"><label>الأصناف (افصلهم بفاصلة)</label>
        <input id="terms" placeholder="لبنة بلدية، عسل سدر، زيت زيتون"></div>
      <div class="fld"><label>البلد</label><input id="country" value="الأردن"></div>
      <button class="btn" id="add">ضيف للمراقبة</button>
    </div>
    <div class="mut">كل صنف بينفحص يومياً تلقائياً. ابدأ بـ5–10 أصناف —
      أكثر من هيك بيطوّل الفحص وبيصعّب الرصد الأسبوعي.</div>
  </div>
  <div class="box"><h3>المراقبون (${j.total})</h3>` +
  B.table(["الصنف", "الفئة", "البلد", "الحالة", "مكتبة الإعلانات", ""], j.rows, r => [
    `<b>${B.esc(r.term)}</b>`, B.esc(r.categoryLabel), B.esc(r.country),
    r.active ? '<span class="tag green">نشط</span>' : '<span class="tag">موقوف</span>',
    `<a class="lib" href="${B.esc(r.adLibrary[0].url)}" target="_blank" rel="noopener">🔗 افتح</a>`,
    `<button class="btn gray" onclick="scan1(${r.id})">افحص</button>
     <button class="btn gray" onclick="del(${r.id})">وقّف</button>`
  ]) + `</div><div id="one"></div>`,
  after: () => {
    g("add").addEventListener("click", async () => {
      const t = g("terms").value.split(/[,،\n]/).map(s => s.trim()).filter(Boolean);
      if (!t.length) return alert("أدخل صنف واحد على الأقل");
      try { await api("POST", "/watch", { terms: t, country: g("country").value }); UI.reload(); }
      catch (e) { alert(e.message); }
    });
    window.del = async id => {
      if (!confirm("توقيف مراقبة هالصنف؟")) return;
      await fetch(`${A}/watch/${id}`, { method: "DELETE" }); UI.reload();
    };
    window.scan1 = async id => {
      g("one").innerHTML = '<div class="load">⏳ بنبحث فعلياً على الويب…</div>';
      try {
        const j = await api("POST", `/scan/${id}`);
        g("one").innerHTML = `<div class="box"><h3>${B.esc(j.term)} — الدرجة ${j.score}</h3>
          <div class="${j.note.startsWith("⚠️") ? "warnbox" : "okbox"}">${B.esc(j.note)}</div>` +
          B.table(["المكوّن", "القيمة", "الوزن", "السبب"], j.parts, p => [
            `<b>${B.esc(p.المكوّن)}</b>`, B.esc(p.القيمة),
            Math.round(p.الوزن * 100) + "%", `<span class="mut">${B.esc(p.السبب)}</span>`
          ]) +
          `<div style="margin-top:12px"><b>مصادر ظهرت بالبحث:</b>
            ${(j.snapshot.signals.sources || []).slice(0, 6).map(s =>
              `<div class="quote"><a class="lib" href="${B.esc(s.url)}" target="_blank"
                rel="noopener">${B.esc(s.title)}</a></div>`).join("")}</div></div>`;
      } catch (e) { g("one").innerHTML = `<div class="err">${B.esc(e.message)}</div>`; }
    };
  }
},

// ═══ اكتشاف أصناف ═══
{
  label: "🔎 اكتشاف", url: () => `${A}/guide`,
  render: j => `<div class="box"><h3>دوّر على أصناف جديدة تراقبها</h3>
    <div class="form">
      <div class="fld" style="flex:1;min-width:220px"><label>المجال</label>
        <input id="niche" value="منتجات غذائية" placeholder="مثلاً: مكسرات، عسل، وجبات صحية"></div>
      <div class="fld"><label>البلد</label><input id="dc" value="الأردن"></div>
      <button class="btn" id="disc">ابحث</button>
    </div>
    <div class="mut">بحث ويب حقيقي — بياخد دقيقة تقريباً.
      المرشّحون اقتراحات للمراقبة مش توصيات شراء.</div>
  </div><div id="dres"></div>`,
  after: () => {
    g("disc").addEventListener("click", async () => {
      g("dres").innerHTML = '<div class="load">⏳ بيبحث فعلياً… استنى شوي</div>';
      try {
        const j = await api("POST", "/discover", { niche: g("niche").value, country: g("dc").value });
        g("dres").innerHTML = `<div class="box"><h3>المرشّحون</h3>
          ${(j.steps || []).map(s => `<div class="quote">🔍 ${B.esc(s.q)}</div>`).join("")}
          <pre class="digest">${B.esc(j.report)}</pre>
          <div class="mut" style="margin-top:10px">انسخ اللي عجبك وضيفه من تبويب "قائمة المراقبة".</div>
        </div>` + B.basis(j.basis);
      } catch (e) { g("dres").innerHTML = `<div class="err">${B.esc(e.message)}</div>`; }
    });
  }
},

// ═══ الدليل ═══
{
  label: "📖 كيف تقرأه", url: () => `${A}/guide`,
  render: j => `<div class="truthbox">
      <b>${B.esc(j.الحقيقة.عنوان)}</b><br>${B.esc(j.الحقيقة.شرح)}</div>
    <div class="okbox"><b>البديل الحقيقي: ${B.esc(j.البديل_الحقيقي.عنوان)}</b><br>
      ${B.esc(j.البديل_الحقيقي.شرح)}<br><br>
      ${j.البديل_الحقيقي.العتبات.map(x => "• " + B.esc(x)).join("<br>")}<br><br>
      <b>القيد:</b> ${B.esc(j.البديل_الحقيقي.القيد)}</div>
    <div class="box"><h3>كيف تشتغل</h3>
      ${j.كيف_تشتغل.map(s => `<div class="item"><div class="w">${B.esc(s)}</div></div>`).join("")}</div>
    <div class="warnbox"><b>توقّع صحيح:</b> ${B.esc(j["🔴_توقّع_صحيح"])}</div>
    <div class="box"><h3>ليش الرصد يدوي</h3>
      <div class="w" style="line-height:1.9">${B.esc(j.لماذا_الرصد_يدوي)}</div></div>`
}
]);

// تشغيل الفحص الكامل
g("scan").addEventListener("click", async () => {
  if (!confirm("الفحص بيبحث فعلياً على الويب لكل صنف — ممكن ياخد دقائق. نبدأ؟")) return;
  try {
    const j = await api("POST", "/scan");
    alert(`بدأ الفحص لـ${j.total} صنف بالخلفية.\nحدّث اللوحة بعد شوي.`);
    poll();
  } catch (e) { alert(e.message); }
});
async function poll() {
  const t = setInterval(async () => {
    try {
      const s = await api("GET", "/scan/status");
      if (!s.running) { clearInterval(t); UI.reload(); }
      else g("scan").textContent = `⏳ ${s.running.done}/${s.running.total}`;
    } catch { clearInterval(t); }
  }, 4000);
}
</script>
  <script src="/theme.js" defer></script>
  <script src="/motion.js" defer></script>
</body></html>
