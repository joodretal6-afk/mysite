<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم — منصة الأجبان</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2e7d32">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --txt:#263238; --mut:#78909c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--txt); }
    header {
      background:var(--green); color:#fff; padding:16px 24px; display:flex;
      align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    }
    header h1 { font-size:20px; display:flex; align-items:center; gap:8px; }
    header .right { display:flex; align-items:center; gap:14px; font-size:14px; }
    header button {
      background:rgba(255,255,255,.2); color:#fff; border:none; padding:8px 14px;
      border-radius:8px; cursor:pointer; font-family:inherit; font-size:13px;
    }
    header button:hover { background:rgba(255,255,255,.32); }
    header .nav { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:8px 11px; border-radius:8px; font-size:13px; }
    header .nav:hover { background:rgba(255,255,255,.34); }
    .wrap { padding:22px; max-width:1400px; margin:0 auto; }

    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
    .stat { background:var(--card); border-radius:14px; padding:18px 20px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .stat .n { font-size:28px; font-weight:bold; color:var(--green2); }
    .stat .l { font-size:13px; color:var(--mut); margin-top:4px; }

    .toolbar {
      background:var(--card); border-radius:14px; padding:16px; margin-bottom:18px;
      display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; box-shadow:0 2px 8px rgba(0,0,0,.05);
    }
    .fld { display:flex; flex-direction:column; gap:5px; }
    .fld label { font-size:12px; color:var(--mut); }
    .fld input, .fld select {
      padding:9px 11px; border:1.5px solid var(--line); border-radius:9px; font-size:14px;
      font-family:inherit; background:#fff; min-width:140px;
    }
    .fld input:focus, .fld select:focus { outline:none; border-color:var(--green); }
    .btn { padding:10px 16px; border:none; border-radius:9px; cursor:pointer; font-size:14px; font-family:inherit; font-weight:600; }
    .btn.primary { background:var(--green); color:#fff; }
    .btn.primary:hover { background:var(--green2); }
    .btn.ghost { background:#eceff1; color:var(--txt); }
    .btn.xls { background:#1d6f42; color:#fff; }
    .btn.csv { background:#455a64; color:#fff; }

    .tbl-card { background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .tbl-scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { padding:12px 14px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { background:#f0f4f1; color:var(--green2); font-weight:700; position:sticky; top:0; }
    td.order { white-space:normal; min-width:200px; }
    tr:hover { background:#fafcfa; }
    .badge { padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; }
    .b-جديد { background:#e3f2fd; color:#1565c0; }
    .b-تم { background:#e8f5e9; color:#2e7d32; }
    .b-ملغي { background:#ffebee; color:#c62828; }
    select.status { padding:6px 8px; border-radius:8px; border:1.5px solid var(--line); font-family:inherit; font-size:13px; cursor:pointer; }
    a.msg { color:var(--green); text-decoration:none; font-size:13px; }
    .del { color:#c62828; cursor:pointer; background:none; border:none; font-size:16px; }
    .edit { cursor:pointer; background:none; border:none; font-size:15px; margin-left:4px; }
    .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; align-items:center; justify-content:center; padding:20px; }
    .modal { background:#fff; border-radius:16px; padding:26px; width:100%; max-width:440px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .modal h3 { color:var(--green2); margin-bottom:16px; }
    .modal label { display:block; font-size:13px; color:#555; margin:12px 0 5px; font-weight:600; }
    .modal input { width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; }
    .modal input:focus { outline:none; border-color:var(--green); }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
    .empty { text-align:center; padding:50px; color:var(--mut); }
    td.total { font-weight:700; color:var(--green2); }
  </style>
</head>
<body>
  <header>
    <h1>🧀 منصة الأجبان — لوحة التحكم</h1>
    <div class="right">
      <span id="who"></span>
      <a href="/admin/analytics" class="nav">📊 تحليلات</a>
      <a href="/admin/insights" class="nav">🔎 رؤى</a>
      <a href="/admin/customers" class="nav">👥 الزبائن</a>
      <a href="/admin/pages" class="nav">📄 الصفحات</a>
      <a href="/admin/inbox" class="nav">📥 الوارد</a>
      <a href="/admin/chats" class="nav">💬 الدردشات</a>
      <a href="/admin/products" class="nav">🛒 منتجات إضافية</a>
      <a href="/admin/coupons" class="nav">🎟️ كوبونات</a>
      <a href="/admin/reviews" class="nav">⭐ تقييمات</a>
      <a href="/admin/handoffs" class="nav">🙋 تدخّل بشري</a>
      <a href="/admin/profit" class="nav">💰 الأرباح</a>
      <a href="/admin/inventory" class="nav">📦 المخزون</a>
      <a href="/admin/prices" class="nav">💵 الأسعار</a>
      <a href="/admin/team" class="nav">👥 الفريق</a>
      <a href="/admin/settings" class="nav">⚙️ الإعدادات</a>
      <a href="/admin/knowledge" class="nav">🧠 تغذية البوت</a>
      <button onclick="logout()">تسجيل خروج</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="fld">
        <label>بحث (طلب / عنوان / تلفون)</label>
        <input id="search" placeholder="اكتب للبحث...">
      </div>
      <div class="fld">
        <label>الصفحة</label>
        <select id="page_id"><option value="">كل الصفحات</option></select>
      </div>
      <div class="fld">
        <label>الحالة</label>
        <select id="status">
          <option value="">الكل</option>
          <option>جديد</option><option>تم التواصل</option>
          <option>تم الشحن</option><option>تم التسليم</option><option>ملغي</option>
        </select>
      </div>
      <div class="fld"><label>من تاريخ</label><input id="from" type="date"></div>
      <div class="fld"><label>إلى تاريخ</label><input id="to" type="date"></div>
      <button class="btn primary" onclick="load()">تطبيق</button>
      <button class="btn ghost" onclick="reset()">مسح</button>
      <button class="btn xls" onclick="exp('xlsx')">⬇ تصدير Excel</button>
      <button class="btn csv" onclick="exp('csv')">⬇ CSV</button>
    </div>

    <div class="tbl-card">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th><th>الصفحة</th><th>الطلب</th><th>الحساب</th>
              <th>العنوان</th><th>التلفون</th><th>الحالة</th><th>ماسنجر</th><th>التاريخ</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none">لا توجد أوردرات مطابقة</div>
    </div>
  </div>

  <!-- نافذة تعديل الأوردر -->
  <div id="editModal" class="modal-bg">
    <div class="modal">
      <h3>✏️ تعديل الأوردر</h3>
      <input type="hidden" id="ed-id">
      <label>الطلب</label>
      <input id="ed-order" placeholder="مثال: غنم (2 نصية)">
      <label>الحساب (دينار)</label>
      <input id="ed-total" type="number" step="0.01">
      <label>العنوان</label>
      <input id="ed-area" placeholder="المحافظة والمنطقة والمعلم">
      <label>التلفون</label>
      <input id="ed-phone" placeholder="07...">
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeEdit()">إلغاء</button>
        <button class="btn primary" id="ed-save" onclick="saveEdit()">💾 حفظ التعديلات</button>
      </div>
    </div>
  </div>

  <script>
    const STATUSES = ["ناقص","جديد","تم التواصل","تم الشحن","تم التسليم","ملغي"];
    let ordersById = {};
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function badgeClass(s){ if(s==='ملغي')return 'b-ملغي'; if(s==='جديد')return 'b-جديد'; return 'b-تم'; }
    function fmtDate(ts){ return new Date(ts).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}); }
    function qs(){
      const p = new URLSearchParams();
      ['search','page_id','status','from','to'].forEach(id=>{ const v=document.getElementById(id).value; if(v)p.set(id,v); });
      return p.toString();
    }

    async function meta(){
      const r = await fetch('/admin/api/meta');
      if(r.status===401){ location.href='/admin/login'; return; }
      const d = await r.json();
      document.getElementById('who').textContent = '👤 ' + d.user;
      const sel = document.getElementById('page_id');
      d.pages.forEach(p=>{ const o=document.createElement('option'); o.value=p.page_id; o.textContent=p.page_name; sel.appendChild(o); });
      // احترام فلتر الصفحة القادم من رابط (صفحة الأوردرات المنفصلة)
      const urlPage = new URLSearchParams(location.search).get('page_id');
      if(urlPage){ sel.value = urlPage; }
      renderStats(d.stats);
      checkNewOrders(d.stats.total.c);   // 🔔 تنبيه الطلبات الجديدة
    }

    // 🔔 تنبيه فوري عند نزول طلب جديد (صوت + إشعار المتصفح)
    let lastTotal = null;
    function checkNewOrders(total){
      if(lastTotal !== null && total > lastTotal){
        const n = total - lastTotal;
        beep();
        notify('🧀 طلب جديد!', `وصلك ${n} طلب جديد على المنصة`);
      }
      lastTotal = total;
    }
    function beep(){
      try{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type='sine'; o.frequency.value=880; g.gain.value=0.15;
        o.start(); o.frequency.setValueAtTime(660, ctx.currentTime+0.15);
        o.stop(ctx.currentTime+0.3);
      }catch(e){}
    }
    // 🔔 إشعار عبر Service Worker (يشتغل حتى لو التطبيق مثبّت على الجوال) مع fallback
    function notify(title, body){
      try{
        if('Notification' in window && Notification.permission!=='granted') return;
        if(navigator.serviceWorker && navigator.serviceWorker.controller){
          navigator.serviceWorker.controller.postMessage({ type:'notify', title, body, tag:'order' });
        } else if('Notification' in window){
          new Notification(title, { body, icon:'/icon.svg' });
        }
      }catch(e){}
    }
    if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); }

    // 📱 تسجيل Service Worker (PWA) — يخلّي المنصة قابلة للتثبيت كتطبيق على الجوال
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW:',e));
    }

    function renderStats(s){
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="n">${s.total.c}</div><div class="l">إجمالي الأوردرات</div></div>
        <div class="stat"><div class="n">${(+s.total.s).toFixed(2)}د</div><div class="l">إجمالي المبيعات</div></div>
        <div class="stat"><div class="n">${s.today.c}</div><div class="l">أوردرات اليوم</div></div>
        <div class="stat"><div class="n">${(+s.today.s).toFixed(2)}د</div><div class="l">مبيعات اليوم</div></div>
        <div class="stat"><div class="n">${s.newCount}</div><div class="l">أوردرات جديدة</div></div>`;
    }

    async function load(){
      const r = await fetch('/admin/api/orders?'+qs());
      if(r.status===401){ location.href='/admin/login'; return; }
      const d = await r.json();
      const tb = document.getElementById('rows');
      const empty = document.getElementById('empty');
      tb.innerHTML='';
      if(!d.rows.length){ empty.style.display='block'; return; }
      empty.style.display='none';
      ordersById = {};
      d.rows.forEach(o=>{
        ordersById[o.id] = o;
        const tr=document.createElement('tr');
        const opts = STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('');
        tr.innerHTML = `
          <td>${o.id}</td>
          <td>${esc(o.page_name)}</td>
          <td class="order">${esc(o.order_string)}</td>
          <td class="total">${(+o.total).toFixed(2)}د</td>
          <td>${esc(o.area)}</td>
          <td>${esc(o.phone)}</td>
          <td><select class="status" onchange="setStatus(${o.id},this.value)">${opts}</select></td>
          <td>${o.messenger_url?`<a class="msg" href="${o.messenger_url}" target="_blank">فتح 💬</a>`:''}</td>
          <td>${fmtDate(o.created_at)}</td>
          <td style="white-space:nowrap">
            <a class="edit" title="فاتورة PDF" href="/admin/invoice/${o.id}" target="_blank" style="text-decoration:none">🧾</a>
            <button class="edit" title="تعديل" onclick="editRow(${o.id})">✏️</button>
            <button class="del" title="حذف" onclick="del(${o.id})">🗑</button>
          </td>`;
        tb.appendChild(tr);
      });
    }

    // ── تعديل أوردر عبر نافذة منبثقة ──
    function editRow(id){
      const o = ordersById[id];
      if(!o) return;
      document.getElementById('ed-id').value = id;
      document.getElementById('ed-order').value = o.order_string || '';
      document.getElementById('ed-total').value = o.total || 0;
      document.getElementById('ed-area').value = o.area || '';
      document.getElementById('ed-phone').value = o.phone || '';
      document.getElementById('editModal').style.display = 'flex';
    }
    function closeEdit(){ document.getElementById('editModal').style.display = 'none'; }
    async function saveEdit(){
      const id = document.getElementById('ed-id').value;
      const body = {
        order_string: document.getElementById('ed-order').value,
        total: document.getElementById('ed-total').value,
        area: document.getElementById('ed-area').value,
        phone: document.getElementById('ed-phone').value
      };
      const btn = document.getElementById('ed-save');
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';
      try{
        const r = await fetch('/admin/api/orders/'+id+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(!r.ok) throw new Error('فشل');
        closeEdit(); load(); meta();
      }catch(e){ alert('فشل الحفظ'); }
      btn.disabled = false; btn.textContent = '💾 حفظ التعديلات';
    }

    async function setStatus(id,status){
      await fetch('/admin/api/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
      meta();
    }
    async function del(id){
      if(!confirm('متأكد من حذف الأوردر؟'))return;
      await fetch('/admin/api/orders/'+id,{method:'DELETE'});
      load(); meta();
    }
    function exp(type){ window.open('/admin/export.'+type+'?'+qs(),'_blank'); }
    function reset(){ ['search','page_id','status','from','to'].forEach(id=>document.getElementById(id).value=''); load(); }
    async function logout(){ await fetch('/admin/logout',{method:'POST'}); location.href='/admin/login'; }

    document.getElementById('search').addEventListener('input', ()=>{ clearTimeout(window._t); window._t=setTimeout(load,350); });
    ['page_id','status','from','to'].forEach(id=>document.getElementById(id).addEventListener('change',load));

    meta().then(load);   // ننتظر تعبئة الفلاتر (وفلتر الرابط) قبل جلب الطلبات
    setInterval(()=>{ meta(); load(); }, 30000); // تحديث تلقائي كل 30 ثانية
  </script>
</body>
</html>
