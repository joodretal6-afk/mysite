<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المستشار — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --mut:#78909c; --gold:#b8860b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:#263238; display:flex; flex-direction:column; height:100dvh; }
    header { background:linear-gradient(120deg,#1b5e20,#2e7d32); color:#fff; padding:13px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    header h1 { font-size:18px; } header a { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:7px 13px; border-radius:8px; font-size:13px; }
    .layout { flex:1; display:flex; overflow:hidden; }
    /* الدردشة */
    .chatcol { flex:1; display:flex; flex-direction:column; min-width:0; }
    .chat { flex:1; overflow-y:auto; padding:18px 14px; }
    .cwrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
    .msg { display:flex; gap:9px; align-items:flex-end; }
    .msg.me { flex-direction:row-reverse; }
    .av { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:17px; background:#e8f0e9; }
    .msg.bot .av { background:#fff8e1; }
    .bub { padding:11px 15px; border-radius:15px; font-size:14.5px; line-height:1.8; max-width:82%; white-space:pre-wrap; word-wrap:break-word; }
    .msg.bot .bub { background:#fff; border:1px solid var(--line); border-bottom-right-radius:5px; }
    .msg.me .bub { background:var(--green); color:#fff; border-bottom-left-radius:5px; }
    .goaltag { align-self:center; background:#fff8e1; color:var(--gold); font-size:13px; font-weight:700; padding:8px 16px; border-radius:20px; border:1px solid #f0e2b6; }
    .typing .bub { color:var(--mut); }
    .composer { background:var(--card); border-top:1px solid var(--line); padding:11px 14px; }
    .cbox { max-width:820px; margin:0 auto; display:flex; gap:9px; align-items:flex-end; background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:5px 7px 5px 5px; }
    .cbox textarea { flex:1; border:none; outline:none; resize:none; font-family:inherit; font-size:14.5px; padding:8px 10px; max-height:110px; background:transparent; }
    .send { width:38px; height:38px; border:none; border-radius:50%; background:var(--green); color:#fff; font-size:17px; cursor:pointer; flex-shrink:0; }
    .send:disabled { opacity:.4; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
    .chip { background:#eef1f0; border:none; border-radius:15px; padding:8px 13px; font-size:12.5px; font-family:inherit; cursor:pointer; color:#37474f; }
    /* الأهداف */
    .goalscol { width:330px; border-inline-start:1px solid var(--line); background:var(--card); overflow-y:auto; padding:16px; flex-shrink:0; }
    .goalscol h3 { font-size:15px; color:var(--green2); margin-bottom:12px; }
    .goal { border:1px solid var(--line); border-radius:12px; padding:13px; margin-bottom:12px; }
    .goal .t { font-weight:700; font-size:14px; margin-bottom:5px; }
    .goal .nums { font-size:13px; color:var(--mut); margin-bottom:7px; }
    .bar { background:#eceff1; border-radius:12px; height:16px; overflow:hidden; }
    .bar > div { height:100%; background:linear-gradient(90deg,#43a047,#2e7d32); color:#fff; font-size:10.5px; text-align:center; line-height:16px; transition:width .4s; min-width:24px; }
    .goal .meta { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:11.5px; color:var(--mut); }
    .goal .plan { font-size:12px; color:#546e7a; background:#f7f9f7; border-radius:8px; padding:8px; margin-top:8px; white-space:pre-wrap; display:none; }
    .goal .actions button { border:none; background:none; cursor:pointer; font-size:12px; color:var(--mut); font-family:inherit; }
    .goal.done { opacity:.65; }
    .empty { text-align:center; color:var(--mut); font-size:13px; padding:24px 6px; }
    @media(max-width:860px){ .goalscol{display:none;} .goalsbtn{display:inline-block!important;} }
    .goalsbtn { display:none; }
  </style>
    <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("pm-theme")||"aurora")}catch(e){}</script>
  <link rel="stylesheet" href="/premium.css">
</head>
<body>
  <header>
    <h1>🧠 المستشار — خبير مبيعاتك</h1>
    <div><a class="goalsbtn" href="#" onclick="alert('الأهداف تظهر على الشاشات الأعرض — افتح من كمبيوتر');return false">🎯</a>
    <a href="/admin">→ اللوحة الرئيسية</a></div>
  </header>
  <div class="layout">
    <div class="chatcol">
      <div class="chat" id="chat"><div class="cwrap" id="cwrap"></div></div>
      <div class="composer">
        <div class="cbox">
          <textarea id="input" rows="1" placeholder="اسأل مستشارك عن الشغل، الضعف، الأهداف..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
          <button class="send" id="sendBtn" onclick="send()">➤</button>
        </div>
      </div>
    </div>
    <div class="goalscol">
      <h3>🎯 الأهداف والعدّادات</h3>
      <div id="goals"><div class="empty">جاري التحميل...</div></div>
    </div>
  </div>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    const cwrap=document.getElementById('cwrap'), chat=document.getElementById('chat'), input=document.getElementById('input');
    let messages=[], busy=false;
    function scroll(){ chat.scrollTop=chat.scrollHeight; }
    function addMsg(role,text){ const me=role==='user';
      const el=document.createElement('div'); el.className='msg '+(me?'me':'bot');
      el.innerHTML=`<div class="av">${me?'👤':'🧠'}</div><div class="bub">${esc(text)}</div>`;
      cwrap.appendChild(el); scroll(); return el; }
    function addTyping(){ const el=document.createElement('div'); el.className='msg bot typing';
      el.innerHTML=`<div class="av">🧠</div><div class="bub">يحلّل بياناتك...</div>`; cwrap.appendChild(el); scroll(); return el; }
    function addGoalTag(g){ const el=document.createElement('div'); el.className='goaltag';
      el.textContent='🎯 هدف جديد انحفظ: '+g.title+' ('+g.target+')'; cwrap.appendChild(el); scroll(); }
    input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(110,input.scrollHeight)+'px'; });

    async function send(txt){
      const text=(txt!=null?txt:input.value).trim();
      if(!text||busy) return;
      busy=true; document.getElementById('sendBtn').disabled=true;
      input.value=''; input.style.height='auto';
      document.querySelectorAll('.chips').forEach(c=>c.remove());
      addMsg('user',text); messages.push({role:'user',content:text});
      const t=addTyping();
      try{
        const r=await fetch('/admin/api/advisor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
        if(r.status===401){ location.href='/admin/login'; return; }
        const d=await r.json();
        t.remove();
        if(d.error){ addMsg('assistant','🙏 '+d.error); }
        else{
          addMsg('assistant',d.reply); messages.push({role:'assistant',content:d.reply});
          (d.createdGoals||[]).forEach(g=>addGoalTag(g));
          if((d.createdGoals||[]).length) loadGoals();
        }
      }catch(e){ t.remove(); addMsg('assistant','🙏 صار خطأ بالاتصال، جرّب كمان مرة.'); }
      busy=false; document.getElementById('sendBtn').disabled=false; input.focus();
    }

    async function loadGoals(){
      const r=await fetch('/admin/api/goals');
      if(r.status===401){ location.href='/admin/login'; return; }
      const {goals}=await r.json();
      const box=document.getElementById('goals');
      if(!goals.length){ box.innerHTML='<div class="empty">ما في أهداف بعد.<br>احكي مع المستشار وقلّه مثلاً:<br>«بدي هدف أبيع 100 ألف بـ3 شهور»</div>'; return; }
      box.innerHTML=goals.map(g=>{
        const unit=g.metric==='orders'?' طلب':'د';
        const done=g.status!=='نشط';
        return `<div class="goal ${done?'done':''}">
          <div class="t">${g.pct>=100?'🏆':'🎯'} ${esc(g.title)} ${done?('<small>('+esc(g.status)+')</small>'):''}</div>
          <div class="nums"><b>${g.current}</b> من <b>${g.target}</b>${unit}</div>
          <div class="bar"><div style="width:${g.pct}%">${g.pct}%</div></div>
          <div class="meta">
            <span>⏳ باقي ${g.daysLeft} يوم</span>
            <span class="actions">
              ${g.plan?`<button onclick="togglePlan(this)">📋 الخطة</button>`:''}
              <button onclick="delGoal(${g.id})" style="color:#c62828">حذف</button>
            </span>
          </div>
          ${g.plan?`<div class="plan">${esc(g.plan)}</div>`:''}
        </div>`;
      }).join('');
    }
    function togglePlan(btn){ const p=btn.closest('.goal').querySelector('.plan'); p.style.display=p.style.display==='block'?'none':'block'; }
    async function delGoal(id){ if(!confirm('حذف الهدف؟'))return; await fetch('/admin/api/goals/'+id,{method:'DELETE'}); loadGoals(); }

    // بداية
    addMsg('assistant','يا هلا فيك 🌹 أنا مستشارك بالمبيعات — شايف كل أرقام شغلك الحقيقية قدامي هلأ.\nاسألني عن أي شي: وين الضعف؟ كيف نرفع المبيعات؟ أو خلينا نحط هدف ونشتغل عليه.');
    const chips=document.createElement('div'); chips.className='chips';
    ['حلّل وضع شغلي الحالي','وين نقاط الضعف عندي؟','كيف أرفع مبيعاتي؟','بدي هدف أبيع 100 ألف بـ3 شهور','شو أحسن أوقات أنشر فيها؟'].forEach(q=>{
      const b=document.createElement('button'); b.className='chip'; b.textContent=q; b.onclick=()=>send(q); chips.appendChild(b);
    });
    cwrap.appendChild(chips); scroll();
    loadGoals(); setInterval(loadGoals, 30000);   // تحديث العدّادات كل 30 ثانية
  </script>
  <script src="/theme.js" defer></script>
</body>
</html>
