<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صندوق الوارد — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --txt:#263238; --mut:#78909c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--txt); }
    header { background:var(--green); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    header h1 { font-size:19px; display:flex; align-items:center; gap:8px; }
    header a, header select { font-size:14px; }
    header a { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:8px 14px; border-radius:8px; }
    header a:hover { background:rgba(255,255,255,.32); }
    select { padding:9px 12px; border-radius:8px; border:none; font-family:inherit; font-size:14px; }
    .wrap { display:grid; grid-template-columns:340px 1fr; gap:16px; padding:18px; max-width:1400px; margin:0 auto; align-items:start; }
    @media(max-width:860px){ .wrap{ grid-template-columns:1fr; } }
    .card { background:var(--card); border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .list-head { padding:14px 16px; font-weight:700; color:var(--green2); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .conv { padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:.15s; }
    .conv:hover { background:#f6faf6; }
    .conv.active { background:#e8f5e9; }
    .conv .name { font-weight:600; display:flex; justify-content:space-between; align-items:center; }
    .conv .snippet { font-size:13px; color:var(--mut); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dot { background:#e53935; color:#fff; font-size:11px; border-radius:20px; padding:2px 8px; font-weight:700; }
    .thread { padding:16px; max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
    .msg { max-width:78%; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    .msg.cust { background:#eceff1; align-self:flex-start; border-bottom-right-radius:4px; }
    .msg.page { background:var(--green); color:#fff; align-self:flex-end; border-bottom-left-radius:4px; }
    .msg .t { display:block; font-size:10px; opacity:.6; margin-top:3px; }
    .extract { border-top:2px solid var(--line); padding:16px; background:#fafcfa; border-radius:0 0 14px 14px; }
    .extract h3 { font-size:15px; color:var(--green2); margin-bottom:12px; }
    .fld { margin-bottom:10px; }
    .fld label { display:block; font-size:12px; color:var(--mut); margin-bottom:4px; }
    .fld input { width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; }
    .fld input:focus { outline:none; border-color:var(--green); }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .save { width:100%; margin-top:8px; padding:13px; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:bold; cursor:pointer; }
    .save:hover { background:var(--green2); }
    .save:disabled { opacity:.6; cursor:not-allowed; }
    .hint { text-align:center; color:var(--mut); padding:40px 20px; }
    .msgbar { padding:10px 16px; font-size:13px; border-radius:9px; margin:12px 16px; }
    .msgbar.err { background:#ffebee; color:#c62828; }
    .msgbar.ok { background:#e8f5e9; color:#2e7d32; }
    .loading { text-align:center; padding:24px; color:var(--mut); }
  </style>
</head>
<body>
  <header>
    <h1>📥 صندوق الوارد</h1>
    <select id="pageSel"><option value="">اختر صفحة...</option></select>
    <a href="/admin">→ لوحة الأوردرات</a>
  </header>

  <div id="topmsg"></div>

  <!-- 🚀 الاستخراج الجماعي بالتاريخ -->
  <div style="max-width:1400px;margin:16px auto 0;padding:0 18px">
    <div class="card" style="padding:16px">
      <div style="font-weight:700;color:var(--green2);margin-bottom:12px">🚀 استخراج جماعي بالتاريخ — يمسح كل الدردشات ويستخرج الطلبات وينزّلها تلقائياً</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div class="fld" style="margin:0"><label>الصفحة</label>
          <select id="bulkPage" style="border:1.5px solid var(--line)"><option value="all">كل الصفحات</option></select>
        </div>
        <div class="fld" style="margin:0"><label>من تاريخ</label><input id="bulkFrom" type="date"></div>
        <div class="fld" style="margin:0"><label>إلى تاريخ</label><input id="bulkTo" type="date"></div>
        <button class="save" id="bulkBtn" style="width:auto;margin:0;padding:11px 22px" onclick="runBulk()">⚡ استخرج وأنزّل الكل</button>
      </div>
      <div id="bulkResult" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="wrap">
    <!-- قائمة المحادثات -->
    <div class="card">
      <div class="list-head">
        <span>المحادثات</span>
        <span id="refreshBtn" style="cursor:pointer;font-size:18px" title="تحديث">🔄</span>
      </div>
      <div id="convList"><div class="hint">اختر صفحة من الأعلى لعرض المحادثات</div></div>
    </div>

    <!-- المحادثة + استخراج الطلب -->
    <div class="card">
      <div id="threadArea"><div class="hint">اختر محادثة لقراءتها واستخراج الطلب منها</div></div>
    </div>
  </div>

  <script>
    let curPage = "", curConv = null, curCustomer = null;

    function topMsg(text, type){ document.getElementById('topmsg').innerHTML = text ? `<div class="msgbar ${type}">${text}</div>` : ''; }
    function fmt(t){ try{ return new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}); }catch{ return ''; } }
    function esc(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    async function loadPages(){
      const r = await fetch('/admin/api/pages-all');
      if(r.status===401){ location.href='/admin/login'; return; }
      const pages = await r.json();
      const sel = document.getElementById('pageSel');
      const bsel = document.getElementById('bulkPage');
      pages.forEach(p=>{
        const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; sel.appendChild(o);
        const o2=document.createElement('option'); o2.value=p.id; o2.textContent=p.name; bsel.appendChild(o2);
      });
    }

    async function runBulk(){
      const btn = document.getElementById('bulkBtn');
      const box = document.getElementById('bulkResult');
      const body = {
        page_id: document.getElementById('bulkPage').value,
        from: document.getElementById('bulkFrom').value,
        to: document.getElementById('bulkTo').value
      };
      btn.disabled = true; btn.textContent = '⏳ جاري المسح... (قد يأخذ دقيقة)';
      box.innerHTML = '<div class="loading">⏳ يفتح الدردشات ويستخرج الطلبات، انتظر لحظة...</div>';
      try {
        const r = await fetch('/admin/api/bulk-extract', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d = await r.json();
        if(!r.ok) throw new Error(d.error||'خطأ');
        let html = `<div class="msgbar ok" style="margin:0 0 10px">
          ✅ تم المسح! فُحص <b>${d.scanned}</b> محادثة —
          حُفظ <b>${d.saved}</b> طلب •
          يحتاج مراجعة يدوية <b>${d.needsReview}</b> (بدون رقم) •
          مكرّر تم تجاهله <b>${d.skippedDup}</b> •
          بدون طلب <b>${d.noOrder}</b></div>`;
        if(d.orders && d.orders.length){
          html += '<div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:9px">';
          html += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
          html += '<tr style="background:#f0f4f1;font-weight:700"><td style="padding:7px">الصفحة</td><td style="padding:7px">الزبون</td><td style="padding:7px">الطلب</td><td style="padding:7px">الحساب</td><td style="padding:7px">التلفون</td></tr>';
          d.orders.forEach(o=>{ html += `<tr style="border-top:1px solid var(--line)"><td style="padding:7px">${esc(o.page)}</td><td style="padding:7px">${esc(o.customer)}</td><td style="padding:7px">${esc(o.order)}</td><td style="padding:7px">${o.total}د</td><td style="padding:7px">${esc(o.phone)}</td></tr>`; });
          html += '</table></div>';
          html += '<div style="margin-top:10px"><a href="/admin" style="color:var(--green);font-weight:600">→ شوف كل الطلبات باللوحة</a></div>';
        }
        if(d.errors && d.errors.length){
          html += '<div class="msgbar err" style="margin:10px 0 0">أخطاء ببعض الصفحات: '+d.errors.map(esc).join(' | ')+'</div>';
        }
        box.innerHTML = html;
      } catch(e){
        box.innerHTML = '<div class="msgbar err" style="margin:0">فشل الاستخراج: '+esc(e.message)+'</div>';
      }
      btn.disabled = false; btn.textContent = '⚡ استخرج وأنزّل الكل';
    }

    async function loadConversations(){
      if(!curPage){ return; }
      topMsg('');
      document.getElementById('convList').innerHTML = '<div class="loading">⏳ جاري جلب المحادثات...</div>';
      try {
        const r = await fetch('/admin/api/conversations?page_id='+encodeURIComponent(curPage));
        const d = await r.json();
        if(!r.ok) throw new Error(d.error||'خطأ');
        renderConvs(d.conversations||[]);
      } catch(e){
        document.getElementById('convList').innerHTML = '';
        topMsg('تعذّر جلب المحادثات: '+e.message+' — قد تحتاج صلاحية pages_messaging / pages_read_engagement للصفحة.', 'err');
      }
    }

    function renderConvs(list){
      const el = document.getElementById('convList');
      if(!list.length){ el.innerHTML = '<div class="hint">لا توجد محادثات</div>'; return; }
      // الغير مقروء أولاً
      list.sort((a,b)=> (b.unread>0)-(a.unread>0));
      el.innerHTML = list.map(c=>`
        <div class="conv" data-id="${c.id}" data-cust="${c.customerId}" data-name="${esc(c.customerName)}" onclick="openConv(this)">
          <div class="name"><span>${esc(c.customerName)}</span>${c.unread>0?`<span class="dot">${c.unread} جديد</span>`:''}</div>
          <div class="snippet">${esc(c.lastMessage)}</div>
        </div>`).join('');
    }

    async function openConv(elm){
      document.querySelectorAll('.conv').forEach(x=>x.classList.remove('active'));
      elm.classList.add('active');
      curConv = elm.dataset.id;
      curCustomer = elm.dataset.cust;
      const name = elm.dataset.name;

      document.getElementById('threadArea').innerHTML = '<div class="loading">⏳ جاري فتح المحادثة...</div>';
      try {
        const r = await fetch('/admin/api/conversation?page_id='+encodeURIComponent(curPage)+'&id='+encodeURIComponent(curConv));
        const d = await r.json();
        if(!r.ok) throw new Error(d.error||'خطأ');
        renderThread(name, d);
      } catch(e){
        document.getElementById('threadArea').innerHTML = '<div class="hint">تعذّر فتح المحادثة: '+e.message+'</div>';
      }
    }

    function renderThread(name, d){
      const msgs = (d.messages||[]).map(m=>`
        <div class="msg ${m.isPage?'page':'cust'}">${esc(m.text)||'📎 مرفق'}<span class="t">${fmt(m.time)}</span></div>`).join('');
      const ex = d.extracted || {};
      document.getElementById('threadArea').innerHTML = `
        <div class="list-head"><span>💬 ${esc(name)}</span></div>
        <div class="thread">${msgs||'<div class="hint">لا رسائل</div>'}</div>
        <div class="extract">
          <h3>🧾 الطلب المستخرَج (راجعه وعدّله ثم احفظه)</h3>
          <div class="fld"><label>تفاصيل الطلب</label><input id="ex_order" value="${esc(ex.orderString)}" placeholder="مثال: غنم (1 نصية)"></div>
          <div class="row2">
            <div class="fld"><label>الحساب (دينار)</label><input id="ex_total" type="number" step="0.01" value="${ex.total||''}"></div>
            <div class="fld"><label>التلفون</label><input id="ex_phone" value="${esc(ex.phone)}" placeholder="07..."></div>
          </div>
          <div class="fld"><label>العنوان</label><input id="ex_area" value="${esc(ex.area)}" placeholder="المحافظة والمنطقة"></div>
          <button class="save" id="saveBtn" onclick="saveOrder()">💾 حفظ الطلب وإنزاله بالجدول</button>
        </div>`;
    }

    async function saveOrder(){
      const btn = document.getElementById('saveBtn');
      const body = {
        page_id: curPage,
        customer_id: curCustomer,
        order_string: document.getElementById('ex_order').value,
        total: document.getElementById('ex_total').value,
        phone: document.getElementById('ex_phone').value,
        area: document.getElementById('ex_area').value
      };
      if(!body.order_string.trim()){ topMsg('اكتب تفاصيل الطلب أولاً', 'err'); return; }
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';
      try {
        const r = await fetch('/admin/api/orders/manual', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d = await r.json();
        if(!r.ok) throw new Error(d.error||'خطأ');
        topMsg('✅ تم حفظ الطلب وإنزاله بالجدول بنجاح (رقم '+d.id+')', 'ok');
        btn.textContent = '✅ تم الحفظ';
      } catch(e){
        topMsg('فشل الحفظ: '+e.message, 'err');
        btn.disabled = false; btn.textContent = '💾 حفظ الطلب وإنزاله بالجدول';
      }
    }

    document.getElementById('pageSel').addEventListener('change', e=>{ curPage = e.target.value; loadConversations(); });
    document.getElementById('refreshBtn').addEventListener('click', loadConversations);
    loadPages();
  </script>
</body>
</html>
