<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدردشات المحفوظة — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --mut:#78909c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:#263238; }
    header { background:var(--green); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    header h1 { font-size:19px; }
    header select { padding:9px 12px; border-radius:8px; border:none; font-family:inherit; font-size:14px; }
    header a { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:8px 14px; border-radius:8px; font-size:13px; }
    .wrap { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:18px; max-width:1300px; margin:0 auto; align-items:start; }
    @media(max-width:820px){ .wrap{ grid-template-columns:1fr; } }
    .card { background:var(--card); border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .head { padding:14px 16px; font-weight:700; color:var(--green2); border-bottom:1px solid var(--line); }
    .thread-item { padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
    .thread-item:hover { background:#f6faf6; }
    .thread-item.active { background:#e8f5e9; }
    .thread-item .id { font-weight:600; font-size:13px; }
    .thread-item .meta { font-size:12px; color:var(--mut); margin-top:3px; }
    .thread { padding:16px; max-height:66vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
    .msg { max-width:80%; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    .msg.in { background:#eceff1; align-self:flex-start; border-bottom-right-radius:4px; }
    .msg.out { background:var(--green); color:#fff; align-self:flex-end; border-bottom-left-radius:4px; }
    .msg .t { display:block; font-size:10px; opacity:.6; margin-top:3px; }
    .hint { padding:40px 20px; text-align:center; color:var(--mut); }
  </style>
</head>
<body>
  <header>
    <h1>💬 الدردشات المحفوظة</h1>
    <select id="pageSel"><option value="">اختر صفحة...</option></select>
    <a href="/admin">→ اللوحة الرئيسية</a>
  </header>
  <div class="wrap">
    <div class="card">
      <div class="head">المحادثات</div>
      <div id="threads"><div class="hint">اختر صفحة لعرض دردشاتها المحفوظة</div></div>
    </div>
    <div class="card">
      <div id="thread"><div class="hint">اختر محادثة لقراءتها</div></div>
    </div>
  </div>

  <script>
    let curPage="";
    function esc(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function fmt(t){ try{ return new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}); }catch{ return ''; } }

    async function loadPages(){
      const r = await fetch('/admin/api/pages-all');
      if(r.status===401){ location.href='/admin/login'; return; }
      const pages = await r.json();
      document.getElementById('pageSel').innerHTML = '<option value="">اختر صفحة...</option>' + pages.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    }
    async function loadThreads(){
      if(!curPage) return;
      document.getElementById('threads').innerHTML = '<div class="hint">⏳ تحميل...</div>';
      const r = await fetch('/admin/api/chats?page_id='+encodeURIComponent(curPage));
      const d = await r.json();
      const el = document.getElementById('threads');
      if(!d.threads || !d.threads.length){ el.innerHTML = '<div class="hint">لا توجد دردشات محفوظة لهذه الصفحة بعد</div>'; return; }
      el.innerHTML = d.threads.map(t=>`
        <div class="thread-item" onclick="openThread('${t.sender_id}',this)">
          <div class="id">👤 زبون ...${esc(String(t.sender_id).slice(-6))}</div>
          <div class="meta">${t.msg_count} رسالة • آخر نشاط ${fmt(t.last_at)}</div>
        </div>`).join('');
    }
    async function openThread(sid, elm){
      document.querySelectorAll('.thread-item').forEach(x=>x.classList.remove('active'));
      elm.classList.add('active');
      document.getElementById('thread').innerHTML = '<div class="hint">⏳ فتح المحادثة...</div>';
      const r = await fetch('/admin/api/chat?page_id='+encodeURIComponent(curPage)+'&sender_id='+encodeURIComponent(sid));
      const d = await r.json();
      const msgs = (d.messages||[]).map(m=>`<div class="msg ${m.direction==='out'?'out':'in'}">${esc(m.body)||'📎'}<span class="t">${fmt(m.created_at)}</span></div>`).join('');
      document.getElementById('thread').innerHTML = `<div class="head">💬 المحادثة</div><div class="thread">${msgs||'<div class="hint">لا رسائل</div>'}</div>`;
    }
    document.getElementById('pageSel').addEventListener('change',e=>{ curPage=e.target.value; loadThreads(); });
    loadPages();
  </script>
</body>
</html>
