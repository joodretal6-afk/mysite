<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الزبائن — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --mut:#78909c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:#263238; }
    header { background:var(--green); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    header h1 { font-size:19px; }
    header a { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:8px 14px; border-radius:8px; font-size:13px; }
    .wrap { max-width:1200px; margin:0 auto; padding:22px; }
    .bar { background:var(--card); border-radius:12px; padding:14px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .bar input { width:100%; max-width:400px; padding:10px 13px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; }
    .card { background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .tbl-scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { padding:12px 14px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { background:#f0f4f1; color:var(--green2); font-weight:700; }
    tr:hover { background:#fafcfa; }
    .vip { background:#fff8e1; color:#b8860b; font-size:11px; padding:2px 8px; border-radius:12px; font-weight:700; }
    .rep { background:#e3f2fd; color:#1565c0; font-size:11px; padding:2px 8px; border-radius:12px; font-weight:700; }
    .ftab { padding:9px 16px; border:1.5px solid var(--line); background:#fff; border-radius:9px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; }
    .ftab.active { background:var(--green); color:#fff; border-color:var(--green); }
    .sc { background:var(--card); border-radius:12px; padding:14px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .sc .n { font-size:22px; font-weight:800; color:var(--green2); }
    .sc .l { font-size:12px; color:var(--mut); margin-top:3px; }
    .spent { font-weight:700; color:var(--green2); }
    a.msg { color:var(--green); text-decoration:none; font-size:13px; }
    .empty { text-align:center; padding:40px; color:var(--mut); }
  </style>
    <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("pm-theme")||"aurora")}catch(e){}</script>
  <link rel="stylesheet" href="/premium.css">
</head>
<body>
  <header>
    <h1>👥 الزبائن</h1>
    <a href="/admin">→ اللوحة الرئيسية</a>
  </header>
  <div class="wrap">
    <div class="bar" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <input id="search" placeholder="🔍 بحث برقم الهاتف أو المنطقة..." style="flex:1;min-width:200px">
      <div style="display:flex;gap:8px">
        <button id="btnAll" class="ftab active" onclick="setFilter('all')">كل الزبائن</button>
        <button id="btnRepeat" class="ftab" onclick="setFilter('repeat')">🔁 المكرّرين فقط</button>
      </div>
    </div>
    <div id="summary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px"></div>
    <div class="card">
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>الزبون</th><th>عدد الطلبات</th><th>إجمالي الإنفاق</th><th>آخر منطقة</th><th>آخر صفحة</th><th>آخر طلب</th><th>ماسنجر</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none">لا يوجد زبائن بعد</div>
    </div>
  </div>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmt(t){ return t?new Date(t).toLocaleDateString('ar-EG'):'—'; }
    let filter='all', allCustomers=[];

    function setFilter(f){
      filter=f;
      document.getElementById('btnAll').classList.toggle('active',f==='all');
      document.getElementById('btnRepeat').classList.toggle('active',f==='repeat');
      render();
    }

    async function load(){
      const s=document.getElementById('search').value;
      const r=await fetch('/admin/api/customers'+(s?'?search='+encodeURIComponent(s):''));
      if(r.status===401){ location.href='/admin/login'; return; }
      allCustomers=(await r.json()).customers;
      render();
    }

    function render(){
      const repeat=allCustomers.filter(c=>c.orders_count>=2);
      const repeatSpent=repeat.reduce((a,c)=>a+(+c.total_spent),0);
      document.getElementById('summary').innerHTML=`
        <div class="sc"><div class="n">${allCustomers.length}</div><div class="l">إجمالي الزبائن</div></div>
        <div class="sc"><div class="n">${repeat.length}</div><div class="l">🔁 زبائن مكرّرين</div></div>
        <div class="sc"><div class="n">${repeatSpent.toFixed(0)}د</div><div class="l">إنفاق المكرّرين</div></div>`;

      const list=(filter==='repeat'?repeat:allCustomers);
      const tb=document.getElementById('rows'), empty=document.getElementById('empty');
      tb.innerHTML='';
      if(!list.length){ empty.style.display='block'; empty.textContent=filter==='repeat'?'لا يوجد زبائن مكرّرين بعد':'لا يوجد زبائن بعد'; return; }
      empty.style.display='none';
      list.forEach(c=>{
        let badge='';
        if(c.orders_count>=3) badge='<span class="vip">دائم ⭐</span>';
        else if(c.orders_count>=2) badge='<span class="rep">مكرّر 🔁</span>';
        tb.insertAdjacentHTML('beforeend',`<tr>
          <td>📞 ${esc(c.phone)} ${badge}</td>
          <td>${c.orders_count}</td>
          <td class="spent">${(+c.total_spent).toFixed(2)}د</td>
          <td>${esc((c.area||'').slice(0,40))}</td>
          <td>${esc(c.last_page)}</td>
          <td>${fmt(c.last_at)}</td>
          <td>${c.messenger_url?`<a class="msg" href="${c.messenger_url}" target="_blank">فتح 💬</a>`:''}</td>
        </tr>`);
      });
    }
    document.getElementById('search').addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(load,350);});
    load();
  </script>
  <script src="/theme.js" defer></script>
</body>
</html>
