<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مركز الميزات — منصة الأجبان</title>
  <style>
    :root { --green:#2e7d32; --green2:#1b5e20; --bg:#f4f6f8; --card:#fff; --line:#e6e9ec; --mut:#78909c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:#263238; }
    header { background:linear-gradient(120deg,#1b5e20,#2e7d32); color:#fff; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    header h1 { font-size:20px; } header a { color:#fff; text-decoration:none; background:rgba(255,255,255,.2); padding:8px 14px; border-radius:8px; font-size:13px; }
    .wrap { max-width:1000px; margin:0 auto; padding:24px 18px; }
    .sub { color:var(--mut); font-size:14px; margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
    .mod { background:var(--card); border-radius:16px; padding:22px 18px; box-shadow:0 2px 10px rgba(0,0,0,.06); text-decoration:none; color:#263238; transition:transform .15s, box-shadow .15s; display:block; }
    .mod:hover { transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.1); }
    .mod .ic { font-size:34px; }
    .mod .t { font-weight:800; font-size:15.5px; margin-top:10px; color:var(--green2); }
    .mod .c { font-size:12.5px; color:var(--mut); margin-top:4px; }
    .empty { text-align:center; color:var(--mut); padding:50px; background:var(--card); border-radius:16px; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ مركز الميزات — 80 أداة لإمبراطورية مبيعاتك</h1>
    <a href="/admin">→ اللوحة الرئيسية</a>
  </header>
  <div class="wrap">
    <div class="sub">8 وحدات × 10 ميزات — كلها آمنة 100% (بدون أي إرسال استباقي أو مخاطر حظر). اضغط أي وحدة لتفتح أدواتها.</div>
    <div class="grid" id="grid"><div class="empty">جاري التحميل...</div></div>
  </div>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    (async()=>{
      const r=await fetch('/admin/api/features-list');
      if(r.status===401){ location.href='/admin/login'; return; }
      const {modules}=await r.json();
      const g=document.getElementById('grid');
      if(!modules.length){ g.innerHTML='<div class="empty">الوحدات قيد التجهيز...</div>'; return; }
      g.innerHTML=modules.map(m=>`<a class="mod" href="/admin/f/${esc(m.slug)}">
        <div class="ic">${esc(m.icon)}</div>
        <div class="t">${esc(m.title)}</div>
        <div class="c">10 ميزات جاهزة</div>
      </a>`).join('');
    })();
  </script>
</body>
</html>
